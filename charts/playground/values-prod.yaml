# Overrides layered on top of values.yaml for a "prod-like" install:
# real resource limits, multiple replicas for the stateless services,
# always re-pulling images instead of trusting a cached local one, and
# no NodePort (a real cluster would front this with an Ingress/LoadBalancer).
services:
  db:
    image:
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  app:
    replicaCount: 2
    image:
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  web:
    replicaCount: 2
    serviceType: ClusterIP
    image:
      pullPolicy: Always
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi
