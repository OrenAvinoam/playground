# Base/default values. Treat this as the "dev" shape: every field a service
# can use is documented here via db/app/web, so values-dev.yaml and
# values-prod.yaml only need to override what actually differs per environment.
services:
  db:
    image:
      repository: orenavinoam11/playground
      tag: db
      pullPolicy: IfNotPresent
    replicaCount: 1
    port: 5432
    serviceType: ClusterIP
    # Plain (non-secret) env vars, rendered directly as key: value.
    env:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
    # Rendered into a Secret named "<service>-secret".
    secret:
      POSTGRES_PASSWORD: playground
    # Env vars sourced from a Secret — can point at this service's own
    # secret (as here) or at another service's, e.g. app pulling from db-secret.
    envFromSecretRef:
      - name: POSTGRES_PASSWORD
        secretName: db-secret
        secretKey: POSTGRES_PASSWORD
    # Governs whether the Service sends this pod traffic — see README for
    # why this is what actually makes the waitFor init containers work.
    readinessProbe:
      exec:
        command: ["pg_isready", "-U", "playground"]
      initialDelaySeconds: 5
      periodSeconds: 5
    # Nothing to wait for — db is first in the startup chain.
    waitFor: []
    resources: {}

  app:
    image:
      repository: orenavinoam11/playground
      tag: app
      pullPolicy: IfNotPresent
    replicaCount: 1
    port: 5000
    serviceType: ClusterIP
    env:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: playground
      DB_USER: playground
    secret: {}
    envFromSecretRef:
      - name: DB_PASSWORD
        secretName: db-secret
        secretKey: POSTGRES_PASSWORD
    readinessProbe:
      httpGet:
        path: /healthz
        port: 5000
      initialDelaySeconds: 5
      periodSeconds: 5
    waitFor:
      - name: db
        port: 5432
    resources: {}

  web:
    image:
      repository: orenavinoam11/playground
      tag: web
      pullPolicy: IfNotPresent
    replicaCount: 1
    port: 80
    serviceType: NodePort
    env: {}
    secret: {}
    envFromSecretRef: []
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 3
      periodSeconds: 5
    waitFor:
      - name: app
        port: 5000
    resources: {}
