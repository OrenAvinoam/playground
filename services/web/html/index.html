<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playground Visit Counter</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 10%; background: #1e1e2e; color: #eee; }
        h1 { font-size: 2.5rem; }
        #count { font-size: 4rem; color: #7dd3fc; }
        #hostname { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Visit Counter</h1>
    <div id="count">...</div>
    <p id="hostname"></p>

    <script>
        fetch('/api/visits')
            .then(res => res.json())
            .then(data => {
                document.getElementById('count').textContent = data.count;
                document.getElementById('hostname').textContent = 'served by ' + data.served_by;
            })
            .catch(() => {
                document.getElementById('count').textContent = 'error';
            });
    </script>
</body>
</html>
